<!DOCTYPE html>
<html lang="en" data-theme="sky" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG Favicon: 4-pointed star gradient -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230ea5e9'/><stop offset='50%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient></defs><path d='M16 2 L18.5 13.5 L30 16 L18.5 18.5 L16 30 L13.5 18.5 L2 16 L13.5 13.5 Z' fill='url(%23g)'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>SoraUI — Build Fast. Ship Less. Own Your UI.</title>
    <meta
      name="description"
      content="Lightweight, accessible, token-first React UI component construction system with 44 primitives, 14 production blocks, 9 cosmic themes, and zero runtime CSS overhead."
    />
    <meta property="og:title" content="SoraUI — Build Fast. Ship Less. Own Your UI." />
    <meta property="og:description" content="Zero-runtime, token-first React UI system. 44 primitives, 14 blocks, 9 themes." />
    <meta property="og:type" content="website" />

    <!-- Anti-FOUC: apply stored docs-theme before React loads -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('docs-theme');
          var preferred = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-docs-theme', preferred);
        } catch (e) {
          document.documentElement.setAttribute('data-docs-theme', 'light');
        }
      })();
    </script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
